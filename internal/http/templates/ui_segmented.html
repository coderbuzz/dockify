{{/* Segmented control that drives htmx: dict Label, Base (URL prefix), Target, Swap, Active (index or -1), Items ("value:Label"). */}}
{{define "ui_segmented"}}<div class="seg" role="group" aria-label="{{.Label}}">{{range $i, $it := .Items}}{{$p := split $it ":"}}<button type="button" class="seg-btn" data-range="{{index $p 0}}" aria-pressed="{{if eq $i $.Active}}true{{else}}false{{end}}" hx-get="{{$.Base}}{{index $p 0}}" hx-target="{{$.Target}}" hx-select="unset" hx-swap="{{$.Swap}}">{{index $p 1}}</button>{{end}}</div>{{end}}
