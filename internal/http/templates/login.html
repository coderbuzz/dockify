<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<base href="{{.BasePath}}">
<title>{{.Title}} - Dockify</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;500;600&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #f8fafc;
  --bg-card: #ffffff;
  --border: #e2e8f0;
  --border-hover: #cbd5e1;
  --border-focus: #6366f1;
  --text: #0f172a;
  --text-muted: #475569;
  --accent: #4f46e5;
  --accent-hover: #4338ca;
  --accent-light: rgba(79, 70, 229, 0.08);
  --red: #ef4444;
  --red-bg: rgba(239, 68, 68, 0.12);
  --shadow-lg: 0 10px 25px -5px rgba(0, 0, 0, 0.08), 0 8px 10px -6px rgba(0, 0, 0, 0.04);
}

html.dark {
  --bg: #090d16;
  --bg-card: #0f172a;
  --border: rgba(255, 255, 255, 0.08);
  --border-hover: rgba(255, 255, 255, 0.18);
  --border-focus: #818cf8;
  --text: #f8fafc;
  --text-muted: #94a3b8;
  --accent: #6366f1;
  --accent-hover: #818cf8;
  --accent-light: rgba(99, 102, 241, 0.15);
  --red: #f87171;
  --red-bg: rgba(248, 113, 113, 0.15);
  --shadow-lg: 0 20px 25px -5px rgba(0, 0, 0, 0.5), 0 8px 10px -6px rgba(0, 0, 0, 0.4);
}

* { box-sizing: border-box; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--text);
  font-family: 'Inter', system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
  font-size: 14px;
  line-height: 1.5;
  -webkit-font-smoothing: antialiased;
  display: flex;
  align-items: center;
  justify-content: center;
  min-height: 100vh;
  padding: 1em;
}

.login-card {
  background: var(--bg-card);
  border: 1px solid var(--border);
  border-radius: 12px;
  padding: 2.2em 2em;
  width: 360px;
  max-width: 100%;
  box-shadow: var(--shadow-lg);
}

.brand-header {
  display: flex;
  align-items: center;
  gap: 0.6rem;
  margin-bottom: 0.4rem;
}
.brand-icon {
  width: 30px;
  height: 30px;
  border-radius: 8px;
  background: linear-gradient(135deg, var(--accent), #818cf8);
  display: inline-flex;
  align-items: center;
  justify-content: center;
  color: #fff;
  font-size: 0.95em;
  font-weight: 800;
  box-shadow: 0 2px 8px rgba(99, 102, 241, 0.35);
}
.login-card h1 { font-size: 1.35em; font-weight: 700; margin: 0; letter-spacing: -0.02em; }
.login-card p { color: var(--text-muted); margin: 0.2em 0 1.5em; font-size: 0.9em; }

.error {
  background: var(--red-bg);
  color: var(--red);
  border: 1px solid rgba(239, 68, 68, 0.25);
  border-radius: 6px;
  padding: 0.6em 0.8em;
  font-size: 0.85em;
  font-weight: 500;
  margin-bottom: 1.2em;
}

label { font-size: 0.85em; font-weight: 500; color: var(--text-muted); display: block; margin-bottom: 0.4em; }
input {
  font-family: inherit;
  font-size: 0.92em;
  padding: 0.6em 0.85em;
  border-radius: 6px;
  border: 1px solid var(--border);
  background: var(--bg);
  color: var(--text);
  width: 100%;
  outline: none;
  margin-bottom: 1.2em;
  transition: border-color 0.15s ease, box-shadow 0.15s ease;
}
input:focus {
  border-color: var(--border-focus);
  box-shadow: 0 0 0 3px var(--accent-light);
}

.btn-primary {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  padding: 0.6em 1em;
  font-size: 0.92em;
  font-weight: 600;
  font-family: inherit;
  border-radius: 6px;
  border: 1px solid var(--accent);
  background: var(--accent);
  color: #ffffff;
  cursor: pointer;
  width: 100%;
  text-align: center;
  transition: all 0.15s ease;
  box-shadow: 0 2px 6px rgba(79, 70, 229, 0.25);
}
.btn-primary:hover {
  background: var(--accent-hover);
  border-color: var(--accent-hover);
  box-shadow: 0 4px 12px rgba(79, 70, 229, 0.35);
  transform: translateY(-1px);
}

.theme-btn {
  position: fixed;
  top: 1.2em;
  right: 1.2em;
  background: var(--bg-card);
  border: 1px solid var(--border);
  border-radius: 6px;
  padding: 0.35em 0.7em;
  cursor: pointer;
  font-size: 0.9em;
  color: var(--text-muted);
  transition: all 0.15s ease;
  box-shadow: var(--shadow-lg);
}
.theme-btn:hover { border-color: var(--border-hover); color: var(--text); }
</style>
</head>
<body>
<button class="theme-btn" onclick="toggleTheme()" id="theme-toggle" title="Toggle theme">☀</button>
<div class="login-card">
  <div class="brand-header">
    <span class="brand-icon">D</span>
    <h1>Dockify</h1>
  </div>
  <p>Sign in to continue</p>
  {{if .Error}}<div class="error">{{.Error}}</div>{{end}}
  <form method="POST" action="login">
    <label for="user">Username</label>
    <input type="text" id="user" name="user" required autofocus autocomplete="username">
    <label for="pass">Password</label>
    <input type="password" id="pass" name="pass" required autocomplete="current-password">
    <button type="submit" class="btn-primary">Sign in</button>
  </form>
</div>
<script>
(function() {
  var t = localStorage.getItem('dockify-theme');
  if (t === 'dark' || (!t && window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
    document.documentElement.classList.add('dark');
    document.getElementById('theme-toggle').textContent = '☾';
  }
})();
function toggleTheme() {
  var h = document.documentElement;
  var b = document.getElementById('theme-toggle');
  h.classList.toggle('dark');
  var isDark = h.classList.contains('dark');
  b.textContent = isDark ? '☾' : '☀';
  localStorage.setItem('dockify-theme', isDark ? 'dark' : 'light');
}
</script>
</body>
</html>
