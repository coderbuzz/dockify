<!doctype html>
<html lang="en" data-palette="indigo" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<base href="{{.BasePath}}">
<title>{{.Title}} - Dockify</title>
{{template "theme_head" .}}
</head>
<body class="login-page">
<button class="btn btn-secondary btn-icon theme-btn" onclick="dockifyCycleTheme()" id="theme-toggle" title="Theme" aria-label="Theme"><span data-theme-icon="light" hidden>{{template "ui_icon" "sun"}}</span><span data-theme-icon="dark" hidden>{{template "ui_icon" "moon"}}</span><span data-theme-icon="system">{{template "ui_icon" "monitor"}}</span></button>
<div class="login-card">
  <div class="brand-header">
    <span class="brand-icon">D</span>
    <h1>Dockify</h1>
  </div>
  <p>Sign in to continue</p>
  {{if .Error}}<div class="error">{{.Error}}</div>{{end}}
  <form method="POST" action="login">
    <label for="user">Username</label>
    <input type="text" id="user" name="user" required autofocus autocomplete="username">
    <label for="pass">Password</label>
    <input type="password" id="pass" name="pass" required autocomplete="current-password">
    <button type="submit" class="btn btn-primary btn-lg">Sign in</button>
  </form>
</div>

</body>
</html>
