<!doctype html>
<html lang="en">
<head>{{template "head" .}}</head>
<body>
{{template "nav" .}}
<div class="container">
  <div class="breadcrumb">
    <a href="servers">Servers</a>
    <span>/</span>
    <a href="servers/{{.Server.ID}}">{{.Server.Name}}</a>
    <span>/</span>
    <span>Edit</span>
  </div>

  <hgroup>
    <h1>Edit Server</h1>
    <p>Update server connection details</p>
  </hgroup>

  {{if .Error}}
  <div class="card" style="color:var(--red)">{{.Error}}</div>
  {{end}}

  <form method="POST" action="servers/{{.Server.ID}}/edit">
    <div class="card">
      <h3>Server</h3>
      <label>Name<input type="text" name="name" value="{{.Server.Name}}" placeholder="my-worker-01" required autofocus></label>
      <label>Host<input type="text" name="host" value="{{.Server.Host}}" placeholder="192.168.1.10" required></label>
      <div class="grid">
        <label>Port<input type="number" name="port" value="{{.Server.Port}}" placeholder="22"></label>
        <label>User<input type="text" name="user" value="{{.Server.User}}" placeholder="root"></label>
      </div>
    </div>
    <div class="card">
      <h3>SSH Key</h3>
      <label>
        <textarea name="ssh_key" rows="8" placeholder="Leave empty to keep current key"></textarea>
        <small>Paste a new key only if you want to replace the current one</small>
      </label>
    </div>
    <div class="card">
      <h3>Registry Credential</h3>
      <div class="grid">
        <label>Registry Host<input type="text" name="registry_host" value="{{or .Server.RegistryHost "ghcr.io"}}" placeholder="ghcr.io"></label>
        <label>Registry User<input type="text" name="registry_user" value="{{.Server.RegistryUser}}" placeholder="github-username" autocomplete="off"></label>
      </div>
      <label>Registry Token<input type="password" name="registry_token" placeholder="{{if .Server.RegistryToken}}Leave empty to keep current token{{else}}ghp_...{{end}}" autocomplete="new-password">
        <small>Used for <code>docker login</code> on the worker before pulling private images. For GHCR, use a PAT with <code>read:packages</code> scope.</small>
      </label>
      {{if .Server.RegistryToken}}
      <label style="display:flex;align-items:center;gap:0.4em;font-size:0.85em;cursor:pointer">
        <input type="checkbox" name="registry_clear" value="1"> Remove registry credential
      </label>
      {{end}}
    </div>
    <div style="display:flex;gap:0.6em;align-items:center">
      <button type="submit" class="btn btn-primary">Save Changes</button>
      <a href="servers/{{.Server.ID}}" class="btn btn-ghost">Cancel</a>
    </div>
  </form>
</div>
{{template "scripts" .}}
</body>
</html>
