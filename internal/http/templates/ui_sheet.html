{{/* Responsive sheet: popup >=700px, bottom panel below. Use ui_sheet_start / ui_sheet_end around the body; put <div class="sheet-foot"> last. */}}
{{define "ui_sheet_start"}}<dialog class="sheet" id="{{.ID}}" aria-labelledby="{{.ID}}-title">
<div class="sheet-head"><h2 id="{{.ID}}-title">{{.Title}}</h2><button type="button" class="btn btn-ghost btn-icon-sm" aria-label="Close" onclick="closeSheet('{{.ID}}')">{{template "ui_icon" "x"}}</button></div>
<div class="sheet-body">{{end}}
{{define "ui_sheet_end"}}</div></dialog>{{end}}
